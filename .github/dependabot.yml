version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Version updates are off: only Dependabot security updates open PRs,
    # and they still follow the options below.
    open-pull-requests-limit: 0
    versioning-strategy: increase
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
